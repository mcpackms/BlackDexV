name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build BlackDex64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # sdkmanager (cmdline-tools 12+) 要求 JDK 17；AGP 4.2.0 + Gradle 6.7.1 要求 JDK 11。
      # 因此装两个 JDK：sdkmanager 用 17，Gradle 用 11（最后一个 setup-java 设置默认 JAVA_HOME）。
      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        id: jdk17
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up JDK 11 (for Gradle)
        uses: actions/setup-java@v4
        id: jdk11
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Configure Android SDK
        # ubuntu-latest 镜像预装 SDK 于 /usr/local/lib/android/sdk
        shell: bash
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Ensure SDK packages
        # 幂等安装：已安装的包会被 sdkmanager 跳过，不会重复下载
        shell: bash
        env:
          JAVA_HOME: ${{ steps.jdk17.outputs.path }}
        run: |
          set -e
          sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-30" "build-tools;30.0.3" "ndk;21.4.7075529" "cmake;3.10.2.4988404" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      - name: Cache NDK & CMake
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/cmake
          key: ndk-${{ runner.os }}-21.4.7075529

      - name: Build APK
        run: |
          chmod +x gradlew
          # -x lint / -x lintVitalRelease：跳过 lint，防止 lint 致命项阻塞构建
          ./gradlew assembleBlackDex64Release \
            --no-daemon \
            -x lint \
            -x lintVitalRelease \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackDex64-release
          path: app/build/outputs/apk/BlackDex64/release/*.apk
          if-no-files-found: error
          compression-level: 0
