name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # BlackDex32 / BlackDex64 为 app/build.gradle 中定义的两个 productFlavor
        flavor: [ BlackDex32, BlackDex64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        # AGP 4.2.0 + Gradle 6.7.1 要求 JDK 8/11，JDK 17 无法构建。
        # 注意：不能使用 android-actions/setup-android，它下载的 cmdline-tools 16.0
        # 要求 JDK 17，与这里冲突；ubuntu runner 已预装完整 Android SDK，直接使用即可。
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Configure Android SDK
        # ubuntu-latest 镜像预装 SDK 于 /usr/local/lib/android/sdk
        # （含 platforms;android-30 / build-tools;30.0.3 / ndk;21.4.7075529 / cmake;3.10.2）
        shell: bash
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Ensure SDK packages
        # 兜底：若镜像缺包则用预装 sdkmanager 补齐。
        # SKIP_JDK_VERSION_CHECK 兼容新版本 sdkmanager 对 JDK 17 的要求。
        shell: bash
        run: |
          set -e
          export SKIP_JDK_VERSION_CHECK=true
          sdkmanager --licenses > /dev/null 2>&1 || true
          installed=$(sdkmanager --list_installed 2>/dev/null || true)
          for pkg in "platforms;android-30" "build-tools;30.0.3" "ndk;21.4.7075529" "cmake;3.10.2.4988404"; do
            if ! echo "$installed" | grep -qF "$pkg"; then
              echo "Installing missing SDK package: $pkg"
              sdkmanager "$pkg" > /dev/null 2>&1
            else
              echo "SDK package present: $pkg"
            fi
          done

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      - name: Build APK
        run: |
          chmod +x gradlew
          # -x lint / -x lintVitalRelease：跳过 lint，防止 lint 致命项阻塞构建
          ./gradlew assemble${{ matrix.flavor }}Release \
            --no-daemon \
            -x lint \
            -x lintVitalRelease \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackDex-${{ matrix.flavor }}-release
          path: app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk
          if-no-files-found: error
          compression-level: 0
