name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # BlackDex32 / BlackDex64 为 app/build.gradle 中定义的两个 productFlavor
        flavor: [ BlackDex32, BlackDex64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        # AGP 4.2.0 + Gradle 6.7.1 要求 JDK 8/11，JDK 17 无法构建
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      - name: Cache NDK & CMake
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/cmake
          key: ndk-${{ runner.os }}-21.4.7075529

      - name: Install SDK packages
        # 项目使用 compileSdk 30 / build-tools 30.0.3 / 默认 NDK (AGP 4.2 => r21)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529" \
            "cmake;3.10.2.4988404" \
            "platform-tools" > /dev/null 2>&1 || true

      - name: Build APK
        env:
          # 关闭 Gradle daemon，避免 CI 环境下的资源问题
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: |
          chmod +x gradlew
          # -x lint / -x lintVitalRelease：跳过 lint，防止 lint 致命项阻塞构建
          ./gradlew assemble${{ matrix.flavor }}Release \
            --no-daemon \
            -x lint \
            -x lintVitalRelease \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackDex-${{ matrix.flavor }}-release
          path: app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk
          if-no-files-found: error
          compression-level: 0
